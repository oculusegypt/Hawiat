kind = "web"
previewPath = "/cleanflow-platform/"
title = "CleanFlow Platform"
description = "صفحة تسويقية لمنصة تشغيل وإدارة شركات النظافة وفرق العمل والطلبات"
version = "1.0.0"
id = "artifacts/sabaik-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/cleanflow-platform/" ]
localPort = 19040

[services.development]
run = "pnpm --filter @workspace/cleanflow-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cleanflow-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/sabaik-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19040"
BASE_PATH = "/cleanflow-platform/"
